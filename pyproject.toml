[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-defensive-monitor"
version = "0.1.0"
description = "Real-world defensive detection fixtures and scoring for security telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "AI Failures / ICU"}
]
keywords = ["security", "blue-team", "mitre-attack", "detection", "telemetry", "threat-intelligence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Intended Audience :: Information Technology"
]

dependencies = []

[project.scripts]
icu-score = "icu.cli:main"

[tool.setuptools.packages.find]
include = ["icu*"]

[tool.setuptools.package-data]
icu = ["data/*.json", "data/*.jsonl"]
